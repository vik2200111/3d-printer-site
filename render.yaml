# Blueprint для Render.com — деплой одной кнопкой:
# Render Dashboard → New → Blueprint → выберите этот репозиторий.
# Либо создайте Static Site вручную: Build Command = npm install && npm run build,
# Publish Directory = dist (см. README.md).
services:
  - type: web
    name: voxel-forge
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
